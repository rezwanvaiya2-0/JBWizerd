# ============================================================
# JBWizerd Panel — docker-compose
#
#   docker compose up -d --build
#
#   Web:         http://localhost:8080   (setup.php runs first-time)
#   phpMyAdmin:  http://localhost:8081   (database manager)
#   DB:          mysql://jbuser:jbpass@db:3306/jbwizerd
#
# After startup, open http://localhost:8080/setup.php and point the
# installer at:
#   DB_HOST = db        (the compose service name, not "localhost")
#   DB_NAME = jbwizerd
#   DB_USER = jbuser
#   DB_PASS = jbpass
# ============================================================

services:
  db:
    image: mysql:8.0
    container_name: jbwizerd_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: jbwizerd
      MYSQL_USER: jbuser
      MYSQL_PASSWORD: jbpass
    volumes:
      # MySQL data lives on the host at ./mysql-data (persistent storage).
      # It survives container rebuilds, `docker compose down` and even
      # `docker compose down -v` — the database is only lost if you
      # delete the ./mysql-data folder manually.
      - ./mysql-data:/var/lib/mysql
      # Pre-seed the schema on first boot (only when mysql-data is empty):
      - ./install.sql:/docker-entrypoint-initdb.d/01-install.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    container_name: jbwizerd_phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: "0"
      PMA_USER: root
      PMA_PASSWORD: rootpass
      UPLOAD_LIMIT: 128M
    ports:
      - "8081:80"

  web:
    build: .
    container_name: jbwizerd_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # These are used by docker-entrypoint.sh to write includes/config.php
      # automatically. Override with your own values.
      JBWIZERD_DB_HOST: db
      JBWIZERD_DB_NAME: jbwizerd
      JBWIZERD_DB_USER: jbuser
      JBWIZERD_DB_PASS: jbpass
      JBWIZERD_PANEL_URL: http://localhost:8080
      JBWIZERD_REGISTRATION_KEY: YOUR-REGISTRATION-KEY-HERE
      JBWIZERD_TIMEZONE: Asia/Dhaka
      # Port inside the container is always 80; the host port is below.
    ports:
      - "8080:80"
